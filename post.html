<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>thinking capsules</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <link rel="icon" type="image/png" href="/thoughtcapsules/tcfavicon.png">

  <style>
    :root {
      --bg: #ffffff;
      --fg: #111111;
      --link: #005bff;
      --mark-light: rgba(255, 241, 118, 0.9);
      --mark-dark: rgba(255, 235, 59, 0.9);
      --quote-fg: #555;
      --quote-bg: rgba(17, 17, 17, 0.06);
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #000000;
        --fg: #ffffff;
        --link: #8fc9ed;
        --quote-fg: #999;
        --quote-bg: rgba(255, 255, 255, 0.16);
      }
    }

    html, body { height: 100%; }
    html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }

    body {
      margin: 0;
      padding: 16px;
      background: var(--bg);
      color: var(--fg);
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      line-height: 1.35;
      -webkit-font-smoothing: antialiased;
    }

    @media (hover: hover) and (pointer: fine) {
      body {
        font-size: 12.6px;
      }
    }

    a, a:visited {
      color: var(--link);
      text-decoration: none;
    }

    a:hover { text-decoration: underline; }

    #content {
      white-space: pre-wrap;
      word-wrap: break-word;
    }

    mark {
      background: none;
      color: inherit;
      padding: 0 2px;
      background-image: linear-gradient(
        transparent 62%,
        var(--mark-light) 62%
      );
    }

    @media (prefers-color-scheme: dark) {
      mark {
        background: none;
        padding: 0;
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 0.15em;
        text-decoration-color: var(--mark-dark);
      }
    }

    .quote-box {
      color: var(--quote-fg);
      background: var(--quote-bg);
      border-radius: 3px;
      padding: 10px 14px;
    }

    .counter {
      color: #767676;
    }

    @media (prefers-color-scheme: dark) {
      .counter {
        color: #999;
      }
    }
  </style>
</head>

<body>

<div id="content">Loading…</div>

<script>
(function () {
  const content = document.getElementById("content");
  const params = new URLSearchParams(window.location.search);
  const file = params.get("p");

  if (!file) {
    content.textContent = "Missing file parameter.";
    return;
  }

  fetch(file)
    .then(r => {
      if (!r.ok) throw new Error();
      return r.text();
    })
    .then(text => {
      const lines = text.split("\n"); // DO NOT trim
      const out = [];
      let markOpen = false; // tracks !! highlight state across lines
      let quoteBuf = null; // buffers consecutive blockquote lines into one box

      // highlight + link + day-counter processing, shared by normal and blockquote lines
      function processLine(line) {
        const segments = line.split("!!");
        let processed = "";
        for (let i = 0; i < segments.length; i++) {
          processed += escapeHTML(segments[i]);
          if (i < segments.length - 1) {
            processed += markOpen ? "</mark>" : "<mark>";
            markOpen = !markOpen;
          }
        }

        processed = processed.replace(
          /\[([^\]]+)\]\(([^)]+)\)/g,
          (m, text, link) => `<a href="${link}">${text}</a>`
        );

        processed = processed.replace(
          /\[(\d+\/\d+)\]/g,
          '<span class="counter">[$1]</span>'
        );

        return processed;
      }

      function flushQuote() {
        if (quoteBuf) {
          out.push(
            `<div class="quote-box">` +
            quoteBuf.map(l => `<div>${l}</div>`).join("") +
            `</div>`
          );
          quoteBuf = null;
        }
      }

      for (let line of lines) {

        // blockquote: \ text (consecutive lines grouped into one box)
        if (line.startsWith("\\ ")) {
          if (!quoteBuf) quoteBuf = [];
          quoteBuf.push(processLine(line.slice(2)));
          continue;
        }
        flushQuote();

        out.push(processLine(line));
      }
      flushQuote();

      content.innerHTML = out.join("\n"); // PRESERVE EMPTY LINES
    })
    .catch(() => {
      content.textContent = "Error loading file.";
    });

  function escapeHTML(str) {
    return str
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;");
  }
})();
</script>

</body>
</html>
